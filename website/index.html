<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Flexpulse — Enterprise Real Android Device Farm Cloud Platform</title>
    <meta name="title" content="Flexpulse — Enterprise Real Android Device Farm Cloud Platform" />
    <meta name="description" content="Manage real hardware Android device farms remotely. High frame-rate WebRTC streaming, ADB tunnel routing, stealth proxies, and cloud orchestration." />
    <meta name="keywords" content="Device farm, Android automation, mobile cloud platform, real hardware device testing, scrcpy web, WebRTC remote control, Flexpulse" />
    <meta name="author" content="Flexpulse" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0b132b" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flexpulse Platform" />
    <meta property="og:title" content="Flexpulse — Enterprise Real Android Device Farm Cloud Platform" />
    <meta property="og:description" content="Remote real hardware Android device orchestration. WebRTC high-FPS control, cloud tunneling, and multi-tenant admin control." />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flexpulse — Enterprise Real Android Device Farm Cloud Platform" />
    <meta name="twitter:description" content="Remote real hardware Android device orchestration. WebRTC high-FPS control, cloud tunneling, and multi-tenant admin control." />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Flexpulse Device Farm Cloud",
      "operatingSystem": "Android, Web, Windows",
      "applicationCategory": "DeveloperApplication",
      "description": "Enterprise cloud platform for remote hardware Android device streaming and farm control.",
      "offers": {
        "@type": "Offer",
        "price": "0.00",
        "priceCurrency": "USD"
      },
      "publisher": {
        "@type": "Organization",
        "name": "Flexpulse"
      }
    }
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; background: #050811; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
        <div style="position: relative; width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
          <div style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent; border-top-color: #38bdf8; border-right-color: #2563eb; animation: diamtPreSpin 1.4s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;"></div>
          <div style="position: absolute; inset: 9px; border-radius: 50%; border: 1.5px dashed rgba(56, 189, 248, 0.35); border-bottom-color: #8b5cf6; animation: diamtPreRev 2.2s linear infinite;"></div>
          <img src="/favicon.svg" alt="Flexpulse" style="width: 44px; height: 44px; border-radius: 12px; box-shadow: 0 0 24px rgba(56, 189, 248, 0.5);" />
        </div>
        <div style="font-size: 20px; font-weight: 900; letter-spacing: 2px; color: #fff; margin-bottom: 6px;">
          FLEXPULSE <span style="color: #38bdf8;">CLOUD</span>
        </div>
        <div style="font-size: 12px; color: #94a3b8; letter-spacing: 0.5px;">
          INITIALIZING SECURE PLATFORM...
        </div>
      </div>
      <style>
        @keyframes diamtPreSpin { 100% { transform: rotate(360deg); } }
        @keyframes diamtPreRev { 100% { transform: rotate(-360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
