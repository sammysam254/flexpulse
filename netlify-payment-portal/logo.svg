<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Dark Rounded Canvas -->
  <rect width="512" height="512" rx="128" fill="#090d16"/>

  <!-- Phone Outer Glow / Border -->
  <rect x="96" y="40" width="320" height="432" rx="48" fill="url(#phoneBody)" stroke="url(#phoneBorder)" stroke-width="6" filter="url(#neonGlow)"/>

  <!-- Phone Screen -->
  <rect x="116" y="80" width="280" height="352" rx="28" fill="url(#screenGrad)"/>

  <!-- Speaker / Camera Notch -->
  <rect x="216" y="58" width="80" height="8" rx="4" fill="#38bdf8" opacity="0.8"/>
  <circle cx="200" cy="62" r="4" fill="#38bdf8" opacity="0.8"/>

  <!-- Pulse Wave Line Inside Screen -->
  <path d="M 120 220 L 190 220 L 220 170 L 256 270 L 290 190 L 320 220 L 392 220" stroke="#a5f3fc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>

  <!-- Flexpulse Brand Text Inside Screen -->
  <text x="256" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    Flexpulse
  </text>
  <text x="256" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7dd3fc" text-anchor="middle" letter-spacing="4">
    CLOUD PLATFORM
  </text>

  <!-- Bottom Home Indicator -->
  <rect x="216" y="446" width="80" height="5" rx="2.5" fill="#38bdf8" opacity="0.6"/>
</svg>
